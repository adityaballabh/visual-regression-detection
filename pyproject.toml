[project]
name = "visual-regression-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy~=2.0",
    "opencv-python-headless~=5.0",
    "scikit-image~=0.24",
    "scikit-learn~=1.9",
    "pillow==12.3.0",
    "scipy~=1.13",
    "rapidfuzz~=3.9",
    "google-genai~=2.0",
    "jinja2~=3.1",
    "compact-json~=1.8",
    "pydantic~=2.0",
    "playwright~=1.61",
    "PyGithub~=2.10",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
include = ["image_diff*", "regression_detection*", "evaluation*", "prairielearn_capture*"]
